<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Parrlo — клавиатура · макеты</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/Nunito-Variable.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{
  --bg:#12161C; --surface:#1C2026; --ink:#0E1116; --green:#2BC48A; --brand:#00A86B; --deep:#00875C;
  --beak:#FFC247; --text:#E8ECF1; --text2:#9AA4B2; --card:#242B34; --glass:#2E3237;
  --warn:#FFC247; --warnBg:#3C372B; --info:#6AA6F5; --successBg:#1E3734;
  /* градиент клавиатуры v2.3: #12161C → смесь с #00875C 6% → 16% */
  --kbG0:#12161C; --kbG1:#111D20; --kbG2:#0F2826;
  --kbGrad:linear-gradient(180deg,var(--kbG0) 0%,var(--kbG1) 45%,var(--kbG2) 100%);
  --kbGlow:radial-gradient(90px 60px at 22px 24px,rgba(43,196,138,.20),rgba(43,196,138,0) 100%);
  --swipeDur:180ms; --swipeEase:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0C10;color:var(--text);font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* ---------- page shell ---------- */
.page{display:grid;grid-template-columns:300px 1fr 300px;gap:24px;min-height:100vh;padding:20px}
.side h1{font-family:Nunito;font-weight:900;font-size:28px;line-height:1.1;margin-bottom:4px}
.side h1 .rr{color:var(--brand)}
.side .sub{color:var(--text2);font-size:14px;line-height:1.4;margin-bottom:12px}
.proto{display:inline-block;background:var(--warnBg);color:var(--warn);font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;margin-bottom:16px;line-height:1.35}
.nav h2{font-family:Nunito;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin:16px 0 6px}
.nav h2.later{color:var(--warn)}
.nav button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.3;color:var(--text)}
.nav button small{display:block;color:var(--text2);font-size:12px}
.nav button:hover{background:#1C2026}
.nav button.on{background:var(--successBg);color:var(--green)}
.stage{display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.notes{font-size:14px;line-height:1.5;color:var(--text2)}
.notes h3{font-family:Nunito;font-weight:900;font-size:20px;color:var(--text);margin-bottom:8px;line-height:1.2}
.notes p{margin-bottom:10px}
.notes b{color:var(--text)}
.notes .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--warnBg);color:var(--warn);margin-bottom:8px}
.ctrl{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.ctrl button{border:1px solid #2E3540;border-radius:10px;padding:6px 10px;font-size:13px}
.bezel{padding:12px;border-radius:64px;background:#2A2F37;box-shadow:0 0 0 2px #3A404A inset,0 30px 80px rgba(0,0,0,.5);transform-origin:top center}
.bezel.se{border-radius:54px;padding:64px 14px}
.bezel.android{border-radius:44px;padding:10px}
/* ---------- device screen ---------- */
.screen{position:relative;overflow:hidden;background:#0B0E12;display:flex;flex-direction:column;border-radius:52px}
.se .screen{border-radius:0}
.android .screen{border-radius:36px}
body.shot{background:#0B0E12}
body.shot .page{display:block;padding:0}
body.shot .side,body.shot .notes{display:none}
body.shot .stage{padding:0;display:block}
body.shot .bezel{padding:0;border-radius:0;box-shadow:none;background:none;transform:none!important}
body.shot .screen{border-radius:0}
/* status bar */
.status{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:600;font-size:17px;position:relative}
.status .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
.status .icons{display:flex;gap:6px;align-items:center}
.status .back{position:absolute;left:14px;top:17px;font-size:13px;font-weight:600;color:var(--info);display:flex;align-items:center;gap:2px;padding:3px 6px;border-radius:10px;box-shadow:0 0 0 2px var(--info)}
.se .status{font-size:12px;padding:0 8px;height:20px}
.android .status{font-size:14px;padding:0 22px}
.android .status .cam{position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#000}
/* messenger */
.mhead{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #1A1F27;background:#0F1217}
.mhead .chev{font-size:28px;color:var(--info);width:20px;line-height:1}
.ava{width:36px;height:36px;border-radius:50%;background:#3A4250;display:grid;place-items:center;font-weight:700;font-size:15px}
.mhead .nm{font-weight:600;font-size:16px}
.mhead .st{font-size:12px;color:var(--text2)}
.chat{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:10px 12px;background:#0B0E12}
.b{max-width:78%;padding:8px 12px;border-radius:18px;font-size:16px;line-height:1.35;position:relative}
.b .t{display:block;font-size:11px;color:rgba(232,236,241,.6);text-align:right;margin-top:2px}
.b.in{align-self:flex-start;background:#232A33;border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:#2B5A8A;border-bottom-right-radius:6px}
.b.sel{box-shadow:0 0 0 2px var(--info)}
.ctxmenu{align-self:flex-start;background:#2A313B;border-radius:14px;overflow:hidden;font-size:15px;width:210px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ctxmenu div{padding:10px 14px;border-bottom:1px solid #353D48;display:flex;justify-content:space-between}
.ctxmenu div:last-child{border:0}
.ctxmenu .hl{background:#36404C}
.toast{align-self:center;background:#2A313B;border-radius:12px;font-size:13px;padding:6px 12px;color:var(--text)}
.inbar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:#0F1217;border-top:1px solid #1A1F27}
.inbar .plus{width:34px;height:36px;display:grid;place-items:center;color:var(--text2)}
.field{flex:1;min-height:36px;max-height:82px;overflow:hidden;border-radius:18px;background:#1A1F27;border:1px solid #2A313B;padding:6px 12px;font-size:16px;line-height:22px;word-break:break-word}
.field .fx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:66px}
.field .ph{color:#6B7480}
.caret{display:inline-block;width:2px;height:19px;background:var(--info);vertical-align:-4px;margin-left:1px;animation:blink 1s steps(1) infinite}
body.shot .caret{animation:none}
@keyframes blink{50%{opacity:0}}
.send{width:36px;height:36px;border-radius:50%;background:#2B5A8A;display:grid;place-items:center;flex:none}
.send.off{background:#232A33;color:#6B7480}
/* ---------- keyboard ---------- */
.kb{flex:none;background:var(--kbGlow),var(--kbGrad);border-top:1px solid #262C35;display:flex;flex-direction:column;position:relative}
.strip{flex:none;display:flex;align-items:center;gap:5px;padding:0 5px}
.parrot{flex:none;display:block;border-radius:50%}
.seg{display:flex;background:var(--ink);border:1px solid #2A313B;border-radius:12px;padding:2px;flex:none}
.seg button{height:36px;padding:0 7px;border-radius:10px;font-size:15px;font-weight:600;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px #3A424D inset}
.seg .lbl{align-self:center;font-size:13px;color:var(--text2);padding:0 1px 0 4px}
.seg.lang button.on{color:var(--green)}
.primary{background:var(--green);color:var(--ink);font-weight:700;border-radius:12px;height:40px;padding:0 11px;font-size:16px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary:active{filter:brightness(.92)}
.secondary{background:var(--surface);color:var(--text);font-weight:700;border-radius:12px;height:40px;padding:0 12px;font-size:16px;border:1px solid #39414C;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.strip .primary{margin-left:auto}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text2);flex:none}
.rows{flex:1;display:flex;flex-direction:column;position:relative}
.row{display:flex;justify-content:center}
.key{flex:none;background:var(--surface);border-radius:9px;border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;font-weight:500;color:var(--text);box-shadow:0 1px 0 #05070A,inset 0 1px 0 rgba(255,255,255,.05);user-select:none;-webkit-user-select:none;position:relative}
.key:active,.key.press{background:#2E3540}
.key.fn{background:#2A3038;color:var(--text);font-size:16px;font-weight:600}
.key.fn.on{background:var(--text);color:var(--ink)}
.key.space{font-size:16px;font-weight:500;color:var(--text2)}
.key.lng{font-size:15px;font-weight:700;color:var(--green)}
.key.mic.later{box-shadow:0 0 0 2px var(--warn) inset}
.key .pop{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#3A424D;border-radius:10px;padding:4px 12px;font-size:32px}
/* свайп по пробелу */
.key.space{overflow:hidden;touch-action:none}
.sp-lab{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#9AA4B2;white-space:nowrap;will-change:transform}
.sp-lab .cur{color:var(--text)}
.sp-lab .ar{font-size:18px;color:#9AA4B2;font-weight:500}
.sp-lab.in-l{animation:spInL var(--swipeDur) var(--swipeEase)}
.sp-lab.in-r{animation:spInR var(--swipeDur) var(--swipeEase)}
@keyframes spInL{from{transform:translateX(60%);opacity:.2}to{transform:none;opacity:1}}
@keyframes spInR{from{transform:translateX(-60%);opacity:.2}to{transform:none;opacity:1}}
.rm .sp-lab.in-l,.rm .sp-lab.in-r{animation:none}
.finger{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(232,236,241,.28);box-shadow:0 0 0 2px rgba(232,236,241,.55);pointer-events:none;z-index:3}
.trail{position:absolute;height:10px;margin-top:-5px;border-radius:5px;background:linear-gradient(90deg,rgba(43,196,138,0),rgba(43,196,138,.0) 5%,rgba(43,196,138,.75));pointer-events:none;z-index:2}
.gcap{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--green);border:1px solid #2F3742;font-size:13px;font-weight:700;padding:5px 10px;border-radius:10px;white-space:nowrap;z-index:3}
/* system row (Face ID iPhones) */
.sysrow{flex:none;background:var(--kbG2);display:flex;justify-content:space-between;align-items:flex-start;padding:6px 26px 0;position:relative;color:#6B7480}
.sysrow .hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:10px;color:#8A93A0;letter-spacing:.04em;text-transform:uppercase}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#E8ECF1}
.navbar{flex:none;background:var(--kbG2);position:relative}
.navbar .homeind{width:108px;height:4px;margin-left:-54px;bottom:10px;background:#9AA4B2}
/* panels that replace rows */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px 12px;gap:8px;background:transparent}
.hintb{position:relative;align-self:flex-start;background:var(--successBg);color:var(--green);font-size:14px;font-weight:600;line-height:1.3;padding:7px 11px;border-radius:12px;max-width:100%}
.hintb:before{content:"";position:absolute;left:14px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--successBg)}
.tcard{flex:1;min-height:0;background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid #2F3742}
.tcard .lab{font-size:12px;font-weight:600;color:var(--text2);display:flex;justify-content:space-between;gap:8px}
.tcard .tx{font-size:20px;line-height:28px;color:var(--text);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#4A5360 transparent;padding-right:4px}
.tcard .tx.clamp{max-height:84px}
.tcard .orig{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .more{font-size:12px;color:var(--text2)}
.pbtns{display:flex;gap:8px;flex:none}
.pbtns button{flex:1;height:52px;font-size:18px;border-radius:14px}
.plaque{flex:1;display:flex;align-items:center;gap:8px;background:var(--warnBg);color:var(--warn);border-radius:12px;padding:5px 6px 5px 10px;font-size:13px;line-height:1.3;font-weight:600;height:44px;text-align:left}
.plaque .go{flex:none;background:var(--warn);color:var(--ink);font-weight:700;border-radius:9px;padding:0 9px;height:32px;display:grid;place-items:center;font-size:13px}
.listen{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--green);flex:1}
.wave{display:flex;gap:3px;align-items:center;height:24px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--green)}
/* ---------- app screens ---------- */
.app{flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;padding:8px 22px 24px;overflow:hidden}
.wm{font-family:Nunito;font-weight:900;font-size:22px;letter-spacing:-.01em}
.wm .rr{color:var(--brand)}
.app h2{font-family:Nunito;font-weight:900;font-size:26px;line-height:1.15;margin:14px 0 8px}
.app .lead{font-size:16px;line-height:1.5;color:var(--text2)}
.steps{list-style:none;margin:18px 0 14px;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.35}
.steps .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--successBg);color:var(--green);display:grid;place-items:center;font-weight:800;font-family:Nunito;font-size:17px}
.setmock{background:#1C2026;border-radius:14px;overflow:hidden;font-size:15px;border:1px solid #2A313B}
.setmock .r{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2A313B}
.setmock .r:last-child{border:0}
.setmock .path{font-size:12px;color:var(--text2);padding:8px 14px 4px}
.tog{width:46px;height:28px;border-radius:14px;background:#3A424D;position:relative;flex:none}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff}
.tog.on{background:var(--green)}
.tog.on:after{left:20px}
.app .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.app .bottom .primary,.app .bottom .secondary{height:54px;font-size:18px;border-radius:16px;width:100%}
.link{color:var(--green);font-weight:600;font-size:16px;text-align:center;padding:6px}
.why{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:16px}
.why li{display:flex;gap:12px;font-size:16px;line-height:1.45}
.why .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--green)}
.dict{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.bigmic{width:96px;height:96px;border-radius:50%;background:var(--green);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(43,196,138,.16)}
.trans{background:var(--card);border-radius:16px;padding:12px 14px;font-size:20px;line-height:1.4;min-height:64px;width:100%;text-align:left}
.trans .lab{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:2px}
.backhint{display:flex;gap:10px;align-items:center;background:#273343;color:var(--info);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:600;line-height:1.35;text-align:left;width:100%}
.backhint .arr{flex:none;font-size:22px;font-weight:800;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--info);border-radius:8px}
</style>
</head>
<body>
<div class="page">
  <aside class="side">
    <h1>Pa<span class="rr">rr</span>lo · клавиатура</h1>
    <p class="sub">Макеты клавиатуры iOS/Android: пишете по-русски — в чат уходит перевод на ES или EN.</p>
    <p class="proto">Прототип: переводы заранее заготовлены</p>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="stage"><div class="bezel" id="bezel"><div class="screen" id="screen"></div></div></main>
  <aside class="notes" id="notes"></aside>
</div>
<script>
'use strict';
/* ---------------- данные ---------------- */
const PARROT = 'parrlo-a.svg';
const ICON = {
  globe:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
  mic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micBig:'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  back:'<svg width="26" height="22" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 4h15a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9l-7-8z"/><path d="M13 9l6 6M19 9l-6 6"/></svg>',
  shift:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 9h-5v8H8v-8H3z"/></svg>',
  shiftOn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 9h-5v8H8v-8H3z"/></svg>',
  ret:'<svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  plus:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clip:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h4"/></svg>',
  swap:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
  globeNet:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  sliders:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',

function keyW(n,d){ return (d.w-2*d.padX-(n-1)*d.gapX)/n; }
function rows(){

  const row=(inner)=>`<div class="row" style="gap:${d.gapX}px">${inner}</div>`;
  let h=`<div class="rows" style="padding:${d.padT}px ${d.padX}px ${d.padB}px;gap:${d.gapY}px">`;
  h+=row(L[0].map(c=>k(c,u)).join(''));
  h+=row(L[1].map(c=>k(c,u)).join(''));
  const r3=L[2], side=(d.w-2*d.padX-r3.length*u-(r3.length+1)*d.gapX)/2;

    inner = parrot + `<div class="listen" style="color:var(--text)">Откроем Parrlo для записи…</div><button class="primary" data-act="toDict">Открыть</button>`;
  } else if (st.clip && !st.text){
    inner = parrot + `<button class="primary" data-act="trClip" style="margin-left:0;flex:1">${ICON.clip} Перевести скопированное</button><button class="iconbtn" data-act="noClip" aria-label="Убрать">${ICON.close}</button>`;
  } else {
    const small = dev==='se';
    const lang = `<div class="seg lang"><span class="lbl">→</span>${['es','en'].map(l=>`<button class="${st.target===l?'on':''}" data-act="target" data-v="${l}" style="${small?'padding:0 6px;font-size:14px':''}">${l.toUpperCase()}</button>`).join('')}</div>`;
    const tone = `<div class="seg">${[['f','Друг'],['p','Вежливо']].map(([v,l])=>`<button class="${st.tone===v?'on':''}" data-act="tone" data-v="${v}" style="${small?'padding:0 5px;font-size:14px':''}">${l}</button>`).join('')}</div>`;
    const act = st.panel ? `<button class="iconbtn" data-act="edit" aria-label="К клавишам" style="margin-left:auto">${ICON.close}</button>`
                         : `<button class="primary" data-act="translate" style="${small?'padding:0 10px;font-size:15px':''}">Перевести</button>`;
    inner = parrot + lang + tone + act;
  }
  return `<div class="strip" style="height:${d.strip}px">${inner}</div>`;
}
function keyboard(){
  const d=DEV[dev];
  let h=`<div class="kb" style="height:${d.kb}px">${strip()}${rows()}`;
  if (st.panel) h=h.replace(/<\/div>$/,'') ;
  h = `<div class="kb" style="height:${d.kb}px">${strip()}<div style="position:relative;flex:1;display:flex;flex-direction:column">${st.panel?rows().replace('class="rows"','class="rows" style="visibility:hidden"').replace('style="visibility:hidden" style="','style="visibility:hidden;'):rows()}${panel()}</div></div>`;
  if (dev==='ios') h+=`<div class="sysrow" style="height:${d.sys}px"><span>${ICON.globe}</span><span class="hint">системный ряд iOS</span><span>${ICON.mic}</span><i class="homeind"></i></div>`;
  if (dev==='android') h+=`<div class="navbar" style="height:${d.sys}px"><i class="homeind"></i></div>`;
  return h;
}
function appScreen(){
  const home = dev==='ios'?'<i class="homeind" style="bottom:8px"></i>':'';
  if (st.view==='enable') return `<div class="app"><div class="wm">Pa<span class="rr">rr</span>lo</div>
    <h2>Включите клавиатуру Parrlo</h2><p class="lead">Пишите по-русски в любом мессенджере — в чат уйдёт перевод.</p>
    <ol class="steps"><li><span class="n">1</span>Нажмите «Открыть Настройки»</li><li><span class="n">2</span>Выберите «Клавиатуры»</li><li><span class="n">3</span>Включите «Parrlo»</li><li><span class="n">4</span>Включите «Полный доступ»</li></ol>
    <div class="setmock"><div class="path">Настройки → Parrlo → Клавиатуры</div><div class="r"><span>Parrlo</span><i class="tog on"></i></div><div class="r"><span>Полный доступ</span><i class="tog on"></i></div></div>
    <div class="bottom"><button class="primary" data-act="openSettings">Открыть Настройки</button><button class="link" data-act="goFA">Зачем полный доступ</button></div></div>${home}`;
  if (st.view==='fullaccess') return `<div class="app"><div class="wm">Pa<span class="rr">rr</span>lo</div>
    <h2>Зачем полный доступ</h2><p class="lead">Без него клавиатура печатает, но не переводит.</p>
    <ul class="why">
      <li><span class="ic">${ICON.globeNet}</span><span>Перевод делается через интернет. Без полного доступа iOS не даёт клавиатуре выходить в сеть.</span></li>
      <li><span class="ic">${ICON.swap}</span><span>На перевод уходит текст, когда вы нажимаете «Перевести» или «Перевести скопированное».</span></li>
      <li><span class="ic">${ICON.info}</span><span>iOS покажет стандартное предупреждение — его видят все, кто включает полный доступ любой клавиатуре.</span></li>
      <li><span class="ic">${ICON.sliders}</span><span>Выключить можно в любой момент: Настройки → Parrlo → Клавиатуры.</span></li>
    </ul>
    <div class="bottom"><button class="primary" data-act="openSettings">Открыть Настройки</button><button class="link" data-act="goEnable">Позже</button></div></div>${home}`;
  if (st.view==='dictation'){
    const said = st.dictDone || true;
    return `<div class="app"><div class="wm" style="text-align:center">Pa<span class="rr">rr</span>lo</div>
     <div class="dict"><img src="${PARROT}" width="104" height="104" alt="Парло слушает" style="border-radius:50%">
     <div class="trans"><span class="lab">Что поняли Parrlo</span>${DICT}</div>
     <button class="bigmic" aria-label="Запись">${ICON.micBig}</button><div style="font-size:16px;color:var(--text2)">Нажмите и говорите</div></div>
     <div class="backhint"><span class="arr">‹</span><span>Вернитесь стрелкой ‹ вверху слева — текст будет в клавиатуре</span></div></div>${home}`;
  }
}
function render(){
  const d=DEV[dev];
  const sc=$('#screen'); sc.style.width=d.w+'px'; sc.style.height=d.h+'px';
  $('#bezel').className='bezel '+(dev==='ios'?'':dev);
  let h=statusBar();
  if (st.view==='chat') h+=chat()+keyboard(); else h+=appScreen();
  sc.innerHTML=h;
  st.anim=null;
  if (st.swipeDemo) drawSwipeDemo();
  fit();
}
function drawSwipeDemo(){
  const sc=$('#screen'), sp=sc.querySelector('[data-space]'); if(!sp) return;
  const a=sc.getBoundingClientRect(), r=sp.getBoundingClientRect(), dx=st.swipeDemo.dx;
  const z=a.width/sc.offsetWidth; const X=(v)=>(v-a.left)/z, Y=(v)=>(v-a.top)/z;
  const y=Y(r.bottom-4), x0=X(r.left+r.width*0.97), x1=x0+dx;
  const tr=document.createElement('i'); tr.className='trail'; tr.style.cssText=`left:${x1}px;top:${y}px;width:${x0-x1}px;transform:scaleX(-1)`;
  const f=document.createElement('i'); f.className='finger'; f.style.cssText=`left:${x1}px;top:${y}px`;
  sc.append(tr,f);
}
function fit(){
  if (document.body.classList.contains('shot')) return;
  const b=$('#bezel'); const H=window.innerHeight-40; const hh=b.offsetHeight; const s=Math.min(1,H/hh);
  b.style.transform=`scale(${s})`; b.parentElement.style.height=(hh*s+10)+'px';
}
function nav(){
  let h='';
  for (const s of S){
    if (s.sec){ h+=`<h2 class="${s.later?'later':''}">${s.sec}</h2>`; continue; }
    h+=`<button data-go="${s.id}" class="${cur&&cur.id===s.id?'on':''}">${s.t}<small>${s.d}</small></button>`;
  }
  $('#nav').innerHTML=h;
}
function notes(){
  $('#notes').innerHTML=`<h3>${cur.t}</h3>${cur.n}<div class="ctrl"><button data-act="reset">Сбросить экран</button><button data-act="rm">Reduce Motion: ${document.body.classList.contains('rm')?'вкл':'выкл'}</button></div><p style="margin-top:10px">Смена языка: свайп по пробелу влево / вправо (мышью — перетащите) или клавиша RU/ES/EN.</p>`;
}
function go(id){
  cur=S.find(s=>s.id===id)||S[1]; dev=cur.dev||'ios';
  st=JSON.parse(JSON.stringify(Object.assign({},BASE,cur.st)));
  st.lastAlpha = st.layout==='num'?'ru':st.layout;
  if (!document.body.classList.contains('shot')) history.replaceState(null,'','#'+cur.id);
  nav(); notes(); render();
}
/* ---------------- ввод ---------------- */
function autoCap(){ const t=st.text; return t==='' || /[.!?]\s$/.test(t) || /\n$/.test(t); }
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const k=e.target.closest('[data-k]');
  if (k){ let ch=k.dataset.k;
    if (st.panel||st.view!=='chat') return;
    if (ch.length===1 && /\p{L}/u.test(ch) && (st.shift||autoCap())) ch=ch.toUpperCase();
    st.text+=ch; st.shift=false; st.clip=false; st.micToast=false; st.src=null; render(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, v=a.dataset.v;
  switch(act){
    case 'shift': st.shift=!st.shift; break;
    case 'bksp': st.text=[...st.text].slice(0,-1).join(''); st.src=null; break;
    case 'num': if (st.layout==='num') st.layout=st.lastAlpha; else { st.lastAlpha=st.layout; st.layout='num'; } break;
    case 'lng': { const c=st.layout==='num'?st.lastAlpha:st.layout; st.layout=ORDER[(ORDER.indexOf(c)+1)%3]; st.lastAlpha=st.layout; st.anim='l'; } break;
    case 'rm': document.body.classList.toggle('rm'); notes(); return;
    case 'target': st.target=v; break;
    case 'tone': st.tone=v; break;
    case 'translate': if (!st.text.trim()) { st.text=RU; } if (st.text===LONG) st.src='long'; else if (st.text===RU) st.src='short'; st.panel='preview'; break;
    case 'edit': st.panel=null; if (st.src==='dict'){ st.text=DICT; } break;
    case 'insert': { const t=trText(); st.text=t.tx; st.panel=null; st.src=null; } break;
    case 'send': if (st.text.trim()){ st.sent.push(st.text.trim()); st.text=''; st.panel=null; } break;
    case 'trClip': st.panel='incoming'; st.clip=false; st.ctx=false; break;
    case 'noClip': st.clip=false; st.ctx=false; break;
    case 'closePanel': st.panel=null; break;
    case 'openSettings': flash('Прототип: здесь откроются Настройки iOS'); return;
    case 'goFA': go('kb-10-app-full-access'); return;
    case 'goEnable': go('kb-09-app-enable'); return;
    case 'mic': if (dev==='android'){ st.listening=true; } else { st.micToast=true; } break;
    case 'micDone': st.listening=false; st.src='dict'; st.panel='preview'; break;
    case 'toDict': go('kb-15-later-mic-app'); return;
    case 'goBack': go('kb-16-later-mic-return'); return;
    case 'reset': go(cur.id); return;
  }
  render();
});
/* свайп по пробелу: ≥40 pt по горизонтали, угол ≤30°; короткий тап — пробел */
let sw=null, swallowClick=false;
document.addEventListener('pointerdown',e=>{
  const sp=e.target.closest('[data-space]'); if(!sp||st.layout==='num'||st.panel) return;
  const z=sp.getBoundingClientRect().width/sp.offsetWidth;
  sw={x:e.clientX,y:e.clientY,z,el:sp,lab:sp.querySelector('.sp-lab'),done:false}; sp.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!sw||sw.done) return;
  const dx=(e.clientX-sw.x)/sw.z, dy=(e.clientY-sw.y)/sw.z;
  if (sw.lab && !document.body.classList.contains('rm')) sw.lab.style.transform=`translateX(${Math.max(-40,Math.min(40,dx*0.5))}px)`;
  const ang=Math.abs(Math.atan2(dy,dx)*180/Math.PI), horiz=Math.min(ang,180-ang)<=30;
  if (Math.abs(dx)>=40 && horiz){
    sw.done=true; swallowClick=true;
    const i=ORDER.indexOf(st.layout);
    st.layout = dx<0 ? ORDER[(i+1)%3] : ORDER[(i+2)%3]; st.lastAlpha=st.layout; st.anim = dx<0?'l':'r';
    render(); /* здесь в iOS: UIImpactFeedbackGenerator(style:.light).impactOccurred() — нужен полный доступ */
  }
});
document.addEventListener('pointerup',()=>{ if(sw){ if(!sw.done && sw.lab) sw.lab.style.transform=''; const moved=sw.done; sw=null; if(moved) setTimeout(()=>swallowClick=false,0);} });
document.addEventListener('click',e=>{ if(swallowClick && e.target.closest('[data-space]')){ e.stopImmediatePropagation(); swallowClick=false; } },true);
function flash(msg){ const n=document.createElement('div'); n.className='proto'; n.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9'; n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),1800); }
window.addEventListener('resize',fit);
const q=new URLSearchParams(location.search);
if (q.get('shot')) document.body.classList.add('shot');
go(q.get('shot') || location.hash.slice(1) || 'kb-01-ru');
</script>
</body>
</html>
